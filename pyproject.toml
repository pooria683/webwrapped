[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webwrapped"
version = "0.1.0"
description = "Your browser history, wrapped — private, local, and offline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "webwrapped contributors"}]
keywords = ["browser-history", "wrapped", "privacy", "cli"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]
dependencies = []

[project.scripts]
webwrapped = "webwrapped.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.7"]
pretty = ["rich>=13"]

[tool.setuptools.packages.find]
include = ["webwrapped*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
